# shellcheck shell=bash
# ---------------------------------------------------------------------------
# Central version pins and upstream locations for LazyGimp.
# Renovate keeps the pinned versions up to date (see .github/renovate.json).
# Nothing else in the repository hardcodes versions or URLs.
# ---------------------------------------------------------------------------

# renovate: datasource=github-releases depName=Diolinux/PhotoGIMP
PHOTOGIMP_RELEASE_TAG="3.0"
PHOTOGIMP_REPO="Diolinux/PhotoGIMP"

# Upstream metadata published by gimp.org. It lists the latest stable
# version and per-platform artifacts (AppImage, Windows installer) with
# SHA-256 checksums, which is how we always ship the newest GIMP without
# ever hardcoding a version number.
GIMP_VERSIONS_JSON_URL="https://www.gimp.org/gimp_versions.json"
GIMP_DOWNLOAD_MIRROR="https://download.gimp.org/gimp"

# Where G'MIC publishes manual builds, used in user-facing hints when no
# distro package is available.
GMIC_DOWNLOAD_PAGE="https://gmic.eu/download.html"

# --- plug-ins (see plugins-install.sh) -------------------------------------

# Batcher — batch processing / export layers for GIMP 3 (BSD-3-Clause).
# renovate: datasource=github-releases depName=kamilburda/batcher
BATCHER_RELEASE_TAG="1.2.9"
BATCHER_REPO="kamilburda/batcher"

# Segment Anything integration — AI subject selection (AGPL-3.0).
# renovate: datasource=github-releases depName=Shriinivas/gimpsegany
SEGANY_RELEASE_TAG="v1.0.0"
SEGANY_REPO="Shriinivas/gimpsegany"

# SAM backend (see lib/segany_backend.sh).
#
# The gimpsegany bridge imports BOTH Python packages at module load, so we
# install both regardless of the model picked — otherwise `import sam2` (or
# `import segment_anything`) raises and the whole plug-in silently produces an
# empty layer group. These are the two pip specs:
SAM1_PIP_SPEC="git+https://github.com/facebookresearch/segment-anything.git"
SAM2_PIP_SPEC="git+https://github.com/facebookresearch/segment-anything-2.git"

# CPU wheels by default: universal and ~10x smaller than CUDA builds.
# GPU users can override, e.g.:
#   LAZYGIMP_TORCH_INDEX_URL=https://download.pytorch.org/whl/cu126
TORCH_INDEX_URL_DEFAULT="https://download.pytorch.org/whl/cpu"

# Model registry. The KEY doubles as the LAZYGIMP_SAM_MODEL value and the
# interactive-menu entry. The VALUE is "family|checkpoint-url|size|note".
# CRITICAL: the checkpoint FILENAME (basename of the URL) is how the plug-in's
# "Auto" model-type detection works — `sam_` => SAM1, `sam2` => SAM2 — so these
# URLs must keep their upstream filenames.
#
# Default is a SAM1 checkpoint: SAM1's load path has no Hydra config-file
# dependency, so it is the combination that reliably works with the pinned
# plug-in bridge (including Auto segmentation). SAM2 entries are offered for
# users who want to opt in, but are marked experimental because this bridge
# targets an older SAM2 config layout (see docs/ARCHITECTURE.md).
SAM_DEFAULT_MODEL="sam_vit_l"
SAM_MODEL_ORDER=(
  sam_vit_l sam_vit_b sam_vit_h
  sam2_hiera_small sam2_hiera_tiny sam2_hiera_base_plus sam2_hiera_large
)
declare -gA SAM_MODELS=(
  [sam_vit_b]="sam1|https://dl.fbaipublicfiles.com/segment_anything/sam_vit_b_01ec64.pth|375MB|SAM1 · lightest, fastest on CPU, lowest quality"
  [sam_vit_l]="sam1|https://dl.fbaipublicfiles.com/segment_anything/sam_vit_l_0b3195.pth|1.2GB|SAM1 · balanced, reliable with this plug-in (recommended)"
  [sam_vit_h]="sam1|https://dl.fbaipublicfiles.com/segment_anything/sam_vit_h_4b8939.pth|2.5GB|SAM1 · best quality, slow on CPU (GPU advised)"
  [sam2_hiera_tiny]="sam2|https://dl.fbaipublicfiles.com/segment_anything_2/072824/sam2_hiera_tiny.pt|150MB|SAM2 · experimental with this plug-in"
  [sam2_hiera_small]="sam2|https://dl.fbaipublicfiles.com/segment_anything_2/072824/sam2_hiera_small.pt|180MB|SAM2 · experimental with this plug-in"
  [sam2_hiera_base_plus]="sam2|https://dl.fbaipublicfiles.com/segment_anything_2/072824/sam2_hiera_base_plus.pt|320MB|SAM2 · experimental with this plug-in"
  [sam2_hiera_large]="sam2|https://dl.fbaipublicfiles.com/segment_anything_2/072824/sam2_hiera_large.pt|900MB|SAM2 · experimental with this plug-in"
)

# Note: associative/indexed arrays are visible to command-substitution
# subshells (same process), so they need no `export`; only scalars do.
export PHOTOGIMP_RELEASE_TAG PHOTOGIMP_REPO \
  GIMP_VERSIONS_JSON_URL GIMP_DOWNLOAD_MIRROR GMIC_DOWNLOAD_PAGE \
  BATCHER_RELEASE_TAG BATCHER_REPO SEGANY_RELEASE_TAG SEGANY_REPO \
  SAM1_PIP_SPEC SAM2_PIP_SPEC TORCH_INDEX_URL_DEFAULT SAM_DEFAULT_MODEL
