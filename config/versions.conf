# shellcheck shell=bash
# ---------------------------------------------------------------------------
# Central version pins and upstream locations for LazyGimp.
# Renovate keeps the pinned versions up to date (see .github/renovate.json).
# Nothing else in the repository hardcodes versions or URLs.
# ---------------------------------------------------------------------------

# renovate: datasource=github-releases depName=Diolinux/PhotoGIMP
PHOTOGIMP_RELEASE_TAG="3.0"
PHOTOGIMP_REPO="Diolinux/PhotoGIMP"

# Flatpak application IDs. The branch (GIMP API version) is resolved
# automatically by flatpak, so new GIMP series need no changes here.
GIMP_FLATPAK_ID="org.gimp.GIMP"
GMIC_FLATPAK_ID="org.gimp.GIMP.Plugin.GMic"

# Upstream metadata published by gimp.org. It lists the latest stable
# version and per-platform artifacts (AppImage, Windows installer) with
# SHA-256 checksums, which is how we always ship the newest GIMP without
# ever hardcoding a version number.
GIMP_VERSIONS_JSON_URL="https://www.gimp.org/gimp_versions.json"
GIMP_DOWNLOAD_MIRROR="https://download.gimp.org/gimp"

# Where G'MIC publishes manual builds, used in user-facing hints when no
# distro package is available.
GMIC_DOWNLOAD_PAGE="https://gmic.eu/download.html"

export PHOTOGIMP_RELEASE_TAG PHOTOGIMP_REPO \
  GIMP_FLATPAK_ID GMIC_FLATPAK_ID \
  GIMP_VERSIONS_JSON_URL GIMP_DOWNLOAD_MIRROR GMIC_DOWNLOAD_PAGE
