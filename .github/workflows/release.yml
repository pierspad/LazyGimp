# ---------------------------------------------------------------------------
# Release — semantic-release on every push to main (and beta pre-releases
# from dev). Conventional commits drive the version bump, changelog, tag,
# GitHub release with assets, and the automatic backmerge main → dev.
# Inspired by MorpheApp/morphe-patches.
# ---------------------------------------------------------------------------
name: Release

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install release tooling
        run: npm install --no-audit --no-fund

      - name: Semantic release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
