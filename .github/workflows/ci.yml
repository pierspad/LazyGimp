# ---------------------------------------------------------------------------
# CI — every pull request (and push to main/dev) must pass:
#   * ruff (lint) on the lazygimp package
#   * unit/smoke tests on every supported Python (GUI import, CLI, registry)
#   * a real build of the release assets (zipapp + PyInstaller binary)
#   * actionlint on the workflows themselves
#   * PSScriptAnalyzer on the Windows installer
# ---------------------------------------------------------------------------
name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ruff
        run: |
          pip install ruff
          ruff check lazygimp lazygimp.py tests

  tests:
    name: Tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Smoke tests (headless — no Tk on purpose)
        run: python -m unittest discover -s tests -v

      - name: Byte-compile everything
        run: python -m compileall -q lazygimp lazygimp.py

  build:
    name: Build release assets (dry run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build prerequisites
        run: |
          sudo apt-get update -q && sudo apt-get install -y python3-tk zip
          pip install pyinstaller

      - name: Build assets
        run: bash scripts/build_release_assets.sh 0.0.0-ci

      - name: Assets must actually run
        run: |
          ./dist/lazygimp.pyz --help
          ./dist/lazygimp-linux-x86_64 --help
          ./dist/lazygimp-linux-x86_64 status

  workflows:
    name: Lint workflows (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: actionlint
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color

  powershell:
    name: Lint Windows installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer -Path windows -Recurse -Severity Warning
          $results | Format-Table -AutoSize
          if ($results | Where-Object Severity -eq 'Error') { exit 1 }
