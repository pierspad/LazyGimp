# ---------------------------------------------------------------------------
# CI — every pull request (and push to main/dev) must pass:
#   * ruff (lint) on the lazygimp package
#   * unit/smoke tests on every supported Python (GUI import, CLI, registry)
#   * a GUI smoke test that builds the real PySide6 app offscreen (no Xvfb
#     needed — QT_QPA_PLATFORM=offscreen) and walks every screen
#   * a real build of the release assets (zipapp + PyInstaller binary)
#   * actionlint on the workflows themselves
#   * PSScriptAnalyzer on the Windows installer
# ---------------------------------------------------------------------------
name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: ruff
        run: |
          pip install ruff
          ruff check lazygimp installer.py tests

  tests:
    name: Tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Smoke tests (headless)
        run: python -m unittest discover -s tests -v

      - name: Byte-compile everything
        run: python -m compileall -q lazygimp installer.py

  qt-gui-smoke:
    name: GUI smoke (PySide6, offscreen)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install PySide6 + the system libs it links against
        run: |
          sudo apt-get update -q && sudo apt-get install -y \
            libegl1 libgl1 libglx0 libopengl0 libxkbcommon0 \
            libxkbcommon-x11-0 libxcb-cursor0 libgbm1
          pip install -r requirements.txt

      - name: Foundation + per-page smoke tests (built independently, earlier phases)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m lazygimp.gui._smoke_test
          python -m lazygimp.gui.pages._smoke_test_landing_uninstall
          python -m lazygimp.gui.pages._smoke_test_wizard
          python -m lazygimp.gui.pages._smoke_test_progress

      - name: Full app integration test (all four pages composed via app.py)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest tests.test_gui_qt_app -v

  build:
    name: Build release assets (dry run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build prerequisites
        run: |
          sudo apt-get update -q && sudo apt-get install -y python3-tk zip
          pip install pyinstaller pillow -r requirements.txt

      - name: Build assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/build_release_assets.sh 0.0.0-ci

      - name: Assets must actually run
        run: |
          ./dist/LazyGimp-Python.pyz --help
          ./dist/LazyGimp-Installer-Linux-x86_64 --help
          ./dist/LazyGimp-Installer-Linux-x86_64 status

  workflows:
    name: Lint workflows (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: actionlint
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color

  build-windows:
    name: Build Windows executable (LazyGimp-Installer-Windows.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build prerequisites
        run: |
          pip install pyinstaller pillow -r requirements.txt

      - name: Build Windows Executable
        run: |
          pyinstaller --onefile --clean --noconfirm --name "LazyGimp-Installer-Windows.exe" --paths lazygimp --hidden-import gimpsam --collect-submodules PIL --collect-submodules lazygimp.gui --collect-all PySide6.QtCore --collect-all PySide6.QtGui --collect-all PySide6.QtWidgets installer.py

      - name: Test Windows Executable Help Output
        run: |
          .\dist\LazyGimp-Installer-Windows.exe --help
