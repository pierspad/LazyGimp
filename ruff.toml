# Lint rules, stated explicitly.
#
# CI installs ruff unpinned, so its *implicit* default rule set is whatever
# the newest release ships. On 2026-08-18 that flipped CI from green to red
# with no code change on our side: ruff 0.16 promoted a pile of pylint,
# bandit and flake8-bugbear rules into the default, and 157 pre-existing
# findings appeared across code nobody had touched.
#
# Selecting the rules here fixes the gate to what this project has always
# actually enforced — pyflakes plus the pycodestyle error classes — and
# makes it independent of the linter's release schedule. Anything stricter
# is then a deliberate opt-in with a cleanup to match, rather than a
# surprise on the next `pip install ruff`.
[lint]
select = ["E4", "E7", "E9", "F"]
